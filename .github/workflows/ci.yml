name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
          ZOOKEEPER_SYNC_LIMIT: 2

      kafka:
        image: confluentinc/cp-kafka:7.4.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      opensearch:
        image: opensearchproject/opensearch:2.11.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # 테스트 실행용 더미 값 (실제 외부 서비스 호출 없음)
      - name: 빌드 및 테스트
        env:
          AWS_ACCESS_KEY: dummy-access-key
          AWS_SECRET_KEY: dummy-secret-key
          AWS_REGION: ap-northeast-2
          AWS_S3_BUCKET: dummy-bucket
          AWS_S3_PRESIGNED_URL_EXPIRATION: 600
          ADMIN_EMAIL: admin@test.com
          ADMIN_NAME: admin
          ADMIN_PASSWORD: admin1234!
          JWT_KEY: test-jwt-secret-key-must-be-at-least-32-bytes-long
          ACCESS_TOKEN_EXPIRATION_MINUTES: 30
          REFRESH_TOKEN_EXPIRATION_MINUTES: 1440
          MAIL_HOST: localhost
          MAIL_PORT: 2525
          MAIL_USERNAME: dummy
          MAIL_PASSWORD: dummy
          TMDB_API_TOKEN: dummy
          TMDB_BASE_URL: http://localhost
          SPORTSDB_API_KEY: dummy
          SPORTSDB_BASE_URL: http://localhost
          OAUTH2_GOOGLE_CLIENT_ID: dummy
          OAUTH2_GOOGLE_CLIENT_SECRET: dummy
          OAUTH2_KAKAO_CLIENT_ID: dummy
          OAUTH2_KAKAO_CLIENT_SECRET: dummy
          HOST: http://localhost
        run: ./gradlew clean test -Dspring.profiles.active=test jacocoTestReport

      - name: Codecov 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true